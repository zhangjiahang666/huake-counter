<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f7cff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="划课" />
  <title>划课 · 设置 / 备份</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div id="storage-warn" class="storage-warn hidden">⚠️ 当前为临时模式（浏览器无法保存），刷新后数据会丢失。</div>

  <header class="site-header">
    <nav class="site-nav">
      <a class="brand" href="index.html">📒 划课</a>
      <div class="links">
        <a href="index.html">仪表盘</a>
        <a href="cards.html">课时卡</a>
        <a href="history.html">历史</a>
        <a href="settings.html" class="active">设置</a>
      </div>
    </nav>
  </header>

  <main class="site-main">
    <h1 class="page-title">设置 / 备份</h1>

    <section class="panel">
      <div class="setting-row">
        <div>
          <div class="s-label">外观</div>
          <div class="s-desc">深色 / 浅色，选择会被记住</div>
        </div>
        <button id="btn-theme" class="btn">🌙 深色模式</button>
      </div>

      <div class="setting-row">
        <div>
          <div class="s-label">立即备份</div>
          <div class="s-desc">下载一份 JSON 备份到本地</div>
        </div>
        <button id="btn-backup" class="btn">⬇ 备份</button>
      </div>

      <div class="setting-row">
        <div>
          <div class="s-label">导出</div>
          <div class="s-desc">导出 JSON 或 Excel（.xls）</div>
        </div>
        <div class="head-right">
          <button id="btn-export" class="btn">JSON</button>
          <button id="btn-excel" class="btn">Excel</button>
        </div>
      </div>

      <div class="setting-row">
        <div>
          <div class="s-label">本地存储</div>
          <div class="s-desc" id="storage-usage">本地存储已用 0.00 MB（浏览器上限约 5 MB）</div>
        </div>
      </div>

      <div class="setting-row">
        <div>
          <div class="s-label">导入</div>
          <div class="s-desc">从备份恢复，可选合并或覆盖</div>
        </div>
        <button id="btn-import" class="btn">导入</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden />
      </div>
    </section>

    <section class="panel hidden" id="account-panel" style="margin-top:18px;">
      <div class="panel-head">
        <h2>账号与同步</h2>
      </div>
      <div class="setting-row">
        <div>
          <div class="s-label" id="account-name">已登录</div>
          <div class="s-desc" id="account-desc">登录同一个账号，电脑 / 手机 / iPad 自动同步同一份数据。</div>
        </div>
        <button id="btn-logout" class="btn">退出登录</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">划课 · 课时计数器</footer>

  <!-- 导入方式 弹窗 -->
  <div id="modal-import" class="modal hidden">
    <div class="modal-box">
      <h3>导入方式</h3>
      <p id="import-text">备份可与现有数据合并，或完全覆盖。选哪种？</p>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="import-merge" class="btn">合并</button>
        <button id="import-overwrite" class="btn primary">覆盖</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/cloud-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

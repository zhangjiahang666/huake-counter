<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f7cff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="划课" />
  <title>划课 · 课时卡</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <div id="storage-warn" class="storage-warn hidden">⚠️ 当前为临时模式（浏览器无法保存），刷新后数据会丢失。</div>

  <header class="site-header">
    <nav class="site-nav">
      <a class="brand" href="index.html">📒 划课</a>
      <div class="links">
        <a href="index.html">仪表盘</a>
        <a href="cards.html" class="active">课时卡</a>
        <a href="history.html">历史</a>
        <a href="settings.html">设置</a>
      </div>
    </nav>
  </header>

  <main class="site-main">
    <h1 class="page-title">课时卡</h1>

    <section class="panel">
      <div class="panel-head">
        <h2>我的课时卡</h2>
        <div class="panel-head-actions">
          <input type="search" id="card-search" class="search-input" placeholder="搜索卡名 / 备注" />
          <button id="btn-manage" class="btn ghost">批量管理</button>
          <button id="btn-add" class="btn primary">+ 添加课时卡</button>
        </div>
      </div>
      <div id="batch-bar" class="batch-bar hidden">
        <span id="batch-count" class="batch-count">已选 0 张</span>
        <button id="batch-up" class="btn sm ghost">↑ 上移</button>
        <button id="batch-down" class="btn sm ghost">↓ 下移</button>
        <button id="batch-all" class="btn sm ghost">全选</button>
        <button id="batch-move" class="btn sm primary" disabled>移动到文件夹</button>
        <button id="batch-cancel" class="btn sm ghost">退出管理</button>
      </div>
      <div class="folder-bar" id="folder-bar"></div>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty hidden">
        <div class="empty-emoji">🗒️</div>
        <div>还没有课时卡</div>
        <div class="empty-hint">点「添加课时卡」开始记录吧</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">划课 · 课时计数器</footer>

  <!-- 添加类型选择 弹窗 -->
  <div id="modal-add-type" class="modal hidden">
    <div class="modal-box">
      <h3>添加什么？</h3>
      <div class="type-choice" id="modal-add-type-inner">
        <button type="button" class="type-item" data-add-kind="lesson">
          <span class="type-emoji">📖</span>
          <span class="type-name">添加课时</span>
          <span class="type-desc">按节计数，逐节划掉</span>
        </button>
        <button type="button" class="type-item" data-add-kind="package">
          <span class="type-emoji">📦</span>
          <span class="type-name">添加课包</span>
          <span class="type-desc">记录总价与购买日期，看剩余价值</span>
        </button>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
      </div>
    </div>
  </div>

  <!-- 添加/编辑 弹窗 -->
  <div id="modal-card" class="modal hidden">
    <div class="modal-box">
      <h3 id="card-modal-title">添加课时卡</h3>
      <div class="kind-switch" id="card-kind">
        <button type="button" class="kind-btn active" data-kind="lesson">📖 课时</button>
        <button type="button" class="kind-btn" data-kind="package">📦 课包</button>
      </div>
      <label>名称
        <input type="text" id="card-name" placeholder="如：瑜伽" maxlength="20" />
      </label>
      <label><span id="card-total-label">总课时</span>
        <input type="number" id="card-total" min="0.1" step="any" value="10" />
      </label>
      <div id="pkg-fields" class="pkg-fields hidden">
        <label>课包总价（¥，选填）
          <input type="number" id="card-price" min="0" step="any" placeholder="如：1980" />
        </label>
        <label>购买日期（选填）
          <input type="date" id="card-purchased" />
        </label>
      </div>
      <label>低余预警阈值（剩余 ≤ 此数变红）
        <input type="number" id="card-lowwarn" min="0" step="any" value="3" />
      </label>
      <label>备注
        <textarea id="card-note" rows="2" maxlength="50" placeholder="选填，如：XX 健身房·私教"></textarea>
      </label>
      <label>所属文件夹
        <select id="card-folder" class="select"></select>
      </label>
      <label>颜色
        <input type="color" id="card-color" value="#4f7cff" />
      </label>
      <div class="field">
        <div class="field-label">封面图片（选填，单张 ≤1MB）</div>
        <div id="card-img-box" class="card-img-box hidden">
          <img id="card-img-preview" class="card-img-preview hidden" alt="封面预览" />
        </div>
        <div class="img-upload-actions">
          <button type="button" id="btn-card-image" class="btn sm">选择图片</button>
          <button type="button" id="btn-card-image-del" class="btn sm ghost">移除</button>
        </div>
        <input type="file" id="card-image" accept="image/*" hidden />
      </div>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="card-save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 新建/重命名文件夹 弹窗 -->
  <div id="modal-folder" class="modal hidden">
    <div class="modal-box">
      <h3 id="folder-modal-title">新建文件夹</h3>
      <label>文件夹名称
        <input type="text" id="folder-name" placeholder="如：瑜伽·周末班" maxlength="20" />
      </label>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="folder-save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 移动到文件夹 弹窗 -->
  <div id="modal-move" class="modal hidden">
    <div class="modal-box">
      <h3>移动到文件夹</h3>
      <p id="move-card-name" class="op-card-name"></p>
      <div class="move-list" id="move-list"></div>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
      </div>
    </div>
  </div>

  <!-- 加减课 弹窗 -->
  <div id="modal-op" class="modal hidden">
    <div class="modal-box">
      <h3 id="op-title">操作</h3>
      <p id="op-card-name" class="op-card-name"></p>
      <div class="chips" id="op-chips"></div>
      <label>数量（节，可填小数）
        <input type="number" id="op-count" min="0.1" step="any" value="1" />
      </label>
      <label>上课日期
        <input type="date" id="op-date" />
      </label>
      <label>备注
        <input type="text" id="op-note" maxlength="50" placeholder="选填，如：第3节·腿法" />
      </label>
      <p id="op-hint" class="op-hint"></p>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="op-confirm" class="btn primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 通用确认 弹窗 -->
  <div id="modal-confirm" class="modal hidden">
    <div class="modal-box">
      <h3 id="confirm-title">确认</h3>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button class="btn ghost" data-close>取消</button>
        <button id="confirm-ok" class="btn danger">确定</button>
      </div>
    </div>
  </div>

  <!-- 收据管理 弹窗 -->
  <div id="modal-receipt" class="modal hidden">
    <div class="modal-box receipt-box">
      <h3>买课收据 · <span id="receipt-card-name"></span></h3>
      <div class="receipt-actions">
        <button type="button" id="btn-receipt-image" class="btn sm primary">+ 上传收据图片</button>
        <button type="button" id="btn-receipt-sheet" class="btn sm primary">+ 上传收据表格</button>
      </div>
      <p class="s-desc">图片单张 ≤1MB；表格请上传 .csv 以便预览。上传记录会标注是谁传的。</p>
      <div id="receipt-list" class="receipt-list"></div>
      <input type="file" id="file-receipt-image" accept="image/*" hidden />
      <input type="file" id="file-receipt-sheet" accept=".csv,text/csv" hidden />
      <div class="modal-actions">
        <button class="btn ghost" data-close>关闭</button>
      </div>
    </div>
  </div>

  <!-- 图片放大预览 -->
  <div id="modal-image" class="modal hidden">
    <div class="modal-box image-box">
      <h3>预览</h3>
      <img id="image-view" class="image-view" alt="预览" />
      <div class="modal-actions">
        <button class="btn ghost" data-close>关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/cloud-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装测试依赖（jsdom）
        run: npm install jsdom --no-save --no-audit --no-fund
      - name: 运行冒烟测试
        run: node scripts/smoke_test.js
